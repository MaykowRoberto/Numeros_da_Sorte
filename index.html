<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campanha de Vendas - Conquista Seguridade</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* =====================================================
           VARIÁVEIS E RESET
        ===================================================== */
        :root {
            --bg-dark: #4282a9;
            --bg-panel: #ffffff;
            --bg-sidebar: #0d1f74;
            --blue-light: #4282a9;
            --blue-dark: #0d1f74;
            --text-main: #0d1f74;
            --text-muted: #4282a9;
            
            --gold: #d4af37;
            --gold-light: #ffdf73;
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #ffdf73 50%, #aa7700 100%);
            
            --wine: #8b0000;
            --red-accent: #e63946;
            --border-glow: rgba(66, 130, 169, 0.3);
            --border-radius: 12px;
            --transition: all 0.3s ease;
            --copyr: #4282a9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, var(--bg-dark) 60%);
        }

        h1, h2, h3, h4 { text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .text-gold { color: var(--gold); }
        .text-gold-light { color: var(--gold-light); }
        .text-blue-dark { color: var(--blue-dark); }
        .text-blue-light { color: var(--blue-light); }
        .text-center { text-align: center; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { display: flex; flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .gap-1 { gap: 8px; }
        .gap-2 { gap: 16px; }
        .gap-3 { gap: 24px; }
        .w-full { width: 100%; }
        .mt-2 { margin-top: 8px; }
        .mt-3 { margin-top: 16px; }
        .font-bold { font-weight: bold; }

        .btn {
            background: var(--gold-gradient);
            color: var(--blue-dark);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5); }
        .btn:active { transform: translateY(0); }
        .btn-outline { background: transparent; border: 2px solid var(--gold); color: var(--gold); box-shadow: none; }
        .btn-outline:hover { background: rgba(212, 175, 55, 0.1); }
        .btn-danger { background: var(--wine); color: white; box-shadow: 0 4px 15px rgba(139, 0, 0, 0.3); border: none; }
        .btn-sm { padding: 6px 12px; font-size: 0.8em; }
        .btn-icon { background: transparent; border: none; cursor: pointer; font-size: 1.2em; padding: 4px 8px; border-radius: 4px; transition: var(--transition); }
        .btn-icon:hover { background: rgba(13,31,116,0.08); }
        .btn-icon.edit { color: var(--blue-light); }
        .btn-icon.delete { color: var(--red-accent); }

        .card {
            background: var(--bg-panel);
            border: 1px solid var(--border-glow);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 4px 15px rgba(13, 31, 116, 0.05);
            transition: var(--transition);
        }
        .card:hover { border-color: var(--blue-light); box-shadow: 0 4px 20px rgba(13, 31, 116, 0.1); }

        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 0.9em; font-weight: 600; color: var(--blue-dark); }
        .input-group input, .input-group select {
            width: 100%; padding: 12px; border-radius: 8px;
            background: #f9f9fa; border: 1px solid var(--blue-light);
            color: var(--blue-dark); font-size: 1em; transition: var(--transition);
        }
        .input-group input:focus, .input-group select:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; cursor: pointer; color: var(--blue-dark); font-weight: 600; }
        .checkbox-group input { width: 20px; height: 20px; cursor: pointer; accent-color: var(--gold); }

        #app { display: flex; flex-direction: column; min-height: 100vh; }
        
        .topbar {
            background: #ffffff; padding: 15px 20px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 2px solid var(--blue-light); position: sticky; top: 0; z-index: 100;
            box-shadow: 0 2px 10px rgba(13, 31, 116, 0.05);
        }
        .topbar-brand { font-size: 1.3em; font-weight: 800; color: var(--blue-dark); display: flex; align-items: center; gap: 10px; }
        
        .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        .sidebar {
            width: 260px; background: var(--bg-sidebar); border-right: 1px solid var(--blue-dark);
            padding: 20px 0; overflow-y: auto; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-item {
            padding: 14px 20px; display: flex; align-items: center; gap: 12px;
            color: #f2f2f4; text-decoration: none; cursor: pointer; transition: var(--transition); font-weight: 600;
        }
        .nav-item:hover, .nav-item.active { color: var(--blue-dark); background: var(--gold-gradient); border-left: 4px solid #ffffff; }
        
        .sidebar-overlay {
            position: fixed; top: 65px; left: 0; width: 100%; height: calc(100vh - 65px);
            background: rgba(13, 31, 116, 0.6); z-index: 95; backdrop-filter: blur(2px);
            opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }

        .content { flex: 1; padding: 25px; overflow-y: auto; }
        .section-title { font-size: 1.8em; color: var(--blue-dark); margin-bottom: 24px; border-bottom: 2px solid var(--blue-light); padding-bottom: 10px; }

        .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { text-align: center; display: flex; flex-direction: column; justify-content: center; background: #ffffff; border-top: 4px solid var(--gold); }
        .stat-value { font-size: 2.8em; font-weight: 800; color: var(--blue-dark); margin: 10px 0; line-height: 1; }
        .stat-label { font-size: 0.9em; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600;}

        .ranking-list { display: flex; flex-direction: column; gap: 12px; }
        .ranking-item { display: flex; align-items: center; background: #ffffff; padding: 12px 20px; border-radius: 8px; border: 1px solid var(--border-glow); box-shadow: 0 2px 5px rgba(13, 31, 116, 0.05); }
        .ranking-item.top-1 { background: linear-gradient(90deg, rgba(212,175,55,0.1) 0%, #ffffff 100%); border-left: 4px solid #FFD700; }
        .ranking-item.top-2 { background: linear-gradient(90deg, rgba(192,192,192,0.1) 0%, #ffffff 100%); border-left: 4px solid #C0C0C0; }
        .ranking-item.top-3 { background: linear-gradient(90deg, rgba(205,127,50,0.1) 0%, #ffffff 100%); border-left: 4px solid #CD7F32; }
        
        .pos-badge { width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; background: var(--blue-dark); color: #ffffff; margin-right: 15px; font-size: 1.2em; }
        .top-1 .pos-badge { background: #FFD700; color: var(--blue-dark); box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .top-2 .pos-badge { background: #C0C0C0; color: var(--blue-dark); }
        .top-3 .pos-badge { background: #CD7F32; color: #fff; }

        .avatar { width: 45px; height: 45px; border-radius: 50%; background: #f2f2f4; display: flex; justify-content: center; align-items: center; margin-right: 15px; border: 2px solid var(--blue-light); overflow: hidden; }
        .avatar span { font-weight: bold; color: var(--blue-dark); }
        .top-1 .avatar { border-color: #FFD700; }

        .rank-info { flex: 1; }
        .rank-name { font-weight: bold; font-size: 1.1em; color: var(--blue-dark); }
        .rank-agency { font-size: 0.85em; color: var(--text-muted); font-weight: 600; }
        .rank-score { text-align: right; }
        .rank-score-val { font-size: 0.8em; color: var(--text-muted); font-weight: 600; margin-bottom: 2px; }
        .rank-score-num { font-size: 1.4em; font-weight: 800; color: var(--gold); line-height: 1; }

        .tickets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .ticket {
            background: linear-gradient(135deg, var(--blue-dark) 0%, #081242 100%);
            border: 1px dashed var(--gold); border-radius: 8px; padding: 15px; text-align: center;
            position: relative; overflow: hidden; transition: var(--transition); color: #ffffff;
            box-shadow: 0 4px 10px rgba(13, 31, 116, 0.2);
        }
        .ticket::before, .ticket::after {
            content: ''; position: absolute; width: 20px; height: 20px; background: var(--bg-dark); border-radius: 50%; top: 50%; transform: translateY(-50%); border: 1px dashed var(--gold);
        }
        .ticket::before { left: -10px; border-left: none; } 
        .ticket::after { right: -10px; border-right: none; }
        .ticket-num { font-size: 1.8em; font-weight: 800; color: var(--gold-light); letter-spacing: 2px; font-family: monospace; }
        .ticket-prod { font-size: 0.85em; color: #a5c6df; margin-top: 5px; font-weight: 600; }

        .ticket-winner {
            background: var(--gold-gradient) !important; border: 2px solid #ffffff;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6); color: var(--blue-dark);
            animation: pulseWinner 2s infinite;
        }
        .ticket-winner .ticket-num { color: var(--blue-dark); text-shadow: 1px 1px 0px rgba(255,255,255,0.8); }
        .ticket-winner .ticket-prod { color: var(--blue-dark); font-weight: 800; }
        .ticket-winner::before, .ticket-winner::after { border-color: #ffffff; background: var(--bg-dark); }

        .table-responsive { width: 100%; overflow-x: auto; max-height: 500px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid rgba(66, 130, 169, 0.2); color: var(--blue-dark); }
        th { color: var(--blue-dark); text-transform: uppercase; font-size: 0.85em; letter-spacing: 1px; background: #f2f2f4; font-weight: 800; }
        tr:hover { background: rgba(66, 130, 169, 0.05); }
        .actions-cell { display: flex; gap: 6px; flex-wrap: wrap; }

        .draw-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; text-align: center; }
        .draw-box { background: radial-gradient(circle, rgba(212,175,55,0.3) 0%, rgba(255,255,255,0) 70%); padding: 50px; border-radius: 50%; margin-bottom: 30px; }
        .draw-number { font-size: 6em; font-weight: 800; color: var(--blue-dark); text-shadow: 0 0 20px rgba(212, 175, 55, 0.8); font-family: monospace; letter-spacing: 5px; }
        .winner-card { transform: scale(0); opacity: 0; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .winner-card.show { transform: scale(1); opacity: 1; }

        .gamification-banner {
            background: linear-gradient(90deg, var(--blue-dark) 0%, var(--blue-light) 100%);
            padding: 15px 20px; border-radius: 8px; border-left: 4px solid var(--gold); margin-bottom: 20px;
            display: flex; align-items: center; gap: 15px; font-weight: bold; color: #ffffff; animation: pulseBanner 2s infinite;
            box-shadow: 0 4px 15px rgba(13, 31, 116, 0.2);
        }

        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 99999 !important; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: var(--blue-dark); border-left: 4px solid var(--gold); padding: 15px 20px; border-radius: 4px; box-shadow: 0 5px 15px rgba(13,31,116,0.5); animation: slideUp 0.3s ease; color: white; font-weight: 600; }
        
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(13,31,116,0.8); backdrop-filter: blur(5px); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .modal { background: #ffffff; border: 2px solid var(--gold); border-radius: 12px; width: 90%; max-width: 500px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); max-height: 90vh; overflow-y: auto;}
        .modal-header { font-size: 1.5em; color: var(--blue-dark); text-align: center; margin-bottom: 20px; font-weight: 800; text-transform: uppercase; border-bottom: 2px solid #f2f2f4; padding-bottom: 10px;}
        .modal-body { margin-bottom: 25px; line-height: 1.5; color: var(--blue-dark); }
        .modal-actions { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }

        @keyframes pulseBanner { 0% { box-shadow: 0 0 0 0 rgba(66, 130, 169, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(66, 130, 169, 0); } 100% { box-shadow: 0 0 0 0 rgba(66, 130, 169, 0.4); } }
        @keyframes pulseWinner { 0% { transform: scale(1); box-shadow: 0 0 10px rgba(212,175,55,0.4); } 50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(212,175,55,0.8); } 100% { transform: scale(1); box-shadow: 0 0 10px rgba(212,175,55,0.4); } }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade { animation: fadeIn 0.4s ease; }

        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -260px; height: calc(100vh - 65px); top: 65px; z-index: 100; }
            .sidebar.open { transform: translateX(260px); box-shadow: 2px 0 15px rgba(13,31,116,0.4); }
            .mobile-menu-btn { display: block; background: none; border: none; color: var(--blue-dark); font-size: 1.5em; cursor: pointer; }
            .content { padding: 15px; }
            .grid-stats { grid-template-columns: 1fr; }
            .draw-number { font-size: 4em; }
            .responsive-table thead { display: none; }
            .responsive-table tbody tr { display: block; border: 1px solid rgba(66,130,169,0.2); border-radius: 8px; margin-bottom: 10px; background: #ffffff; padding: 10px; }
            .responsive-table tbody td { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(66,130,169,0.1); padding: 8px 0; }
            .responsive-table tbody td::before { content: attr(data-label); font-weight: bold; color: var(--blue-dark); font-size: 0.85em; text-transform: uppercase; }
            .responsive-table tbody td:last-child { border-bottom: none; }
            .config-grid { grid-template-columns: 1fr !important; }
        }
        @media (min-width: 769px) {
            .mobile-menu-btn { display: none; }
            .config-grid { display: grid; grid-template-columns: 1fr; gap: 20px; } 
        }

        .copy { font-size: 12px; color: #a5c6df; text-align: center; border-top: 1px dashed var(--blue-light); margin-bottom: 2rem; padding-top: 15px; }
        .text-muted-dark { color: #5a6268; }
    </style>
</head>
<body>

    <div id="custom-modal" class="modal-overlay hidden">
        <div class="modal animate-fade">
            <div id="modal-title" class="modal-header"></div>
            <div id="modal-content" class="modal-body"></div>
            <div id="modal-actions" class="modal-actions"></div>
        </div>
    </div>

    <!-- TELA DE LOGIN -->
    <div id="view-login" class="flex flex-col items-center justify-center w-full min-h-[100vh]" style="min-height: 100vh;">
        <div class="card animate-fade" style="width: 100%; max-width: 420px; text-align: center; padding: 40px 30px; box-shadow: 0 10px 30px rgba(13,31,116,0.1);">
            <img src="logo.png" alt="Conquista Seguridade" onerror="this.style.display='none'" style="max-width: 100%; height: auto; width: 300px; margin: 0 auto 20px; display: block;">
            <h2 class="text-blue-dark">CONQUISTA SEGURIDADE</h2>
            <p style="color: var(--text-muted); margin-bottom: 30px; font-weight: 600;">Campanha de Incentivo a Vendas</p>
            
            <form id="form-login" onsubmit="App.login(event)">
                <div class="input-group">
                    <label>Login / Matrícula</label>
                    <input type="text" id="login-user" required placeholder="Ex: c000000">
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="login-pass" required placeholder="******">
                </div>
                <button type="submit" id="btn-login-submit" class="btn w-full" style="margin-top: 15px; font-size: 1.1em;">Entrar na Campanha</button>
            </form>
        </div>
    </div>

    <!-- APLICATIVO PRINCIPAL -->
    <div id="app" class="hidden">
        <header class="topbar">
            <div class="flex items-center gap-2">
                <button class="mobile-menu-btn" onclick="UI.toggleSidebar()">☰</button>
                <div class="topbar-brand">CONQUISTA SEGURIDADE</div>
            </div>
            <div class="flex items-center gap-2">
                <div class="avatar" style="width: 40px; height: 40px; margin: 0; background: var(--blue-dark); color: #fff;" id="topbar-avatar"><span></span></div>
                <span id="topbar-name" style="font-weight: 700; color: var(--blue-dark); display: none;"></span>
            </div>
        </header>

        <div class="main-container">
            <nav class="sidebar" id="sidebar"></nav>
            <div id="sidebar-overlay" class="sidebar-overlay" onclick="UI.closeSidebar()"></div>
            <main class="content" id="main-content"></main>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        // =====================================================
        // SUPABASE CLIENT INITIALIZATION
        // =====================================================
        const supabaseUrl = 'https://nhltfxpsqbhbxqbcuqwj.supabase.co';
        const supabaseKey = 'sb_publishable_9bl8kRmAQlQhjBxyIcghWA_Zl87vi5p';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        // =====================================================
        // DB WRAPPER (Substitui Local DB de forma limpa)
        // =====================================================
        const DB = {
            getAll: async (table) => {
                const { data, error } = await supabaseClient.from(table).select('*');
                if (error) console.error(error);
                return data || [];
            },
            getById: async (table, id) => {
                 const { data } = await supabaseClient.from(table).select('*').eq('id', id).single();
                 return data;
            },
            getByIndex: async (table, col, val) => {
                 const { data } = await supabaseClient.from(table).select('*').eq(col, val);
                 return data || [];
            },
            save: async (table, item) => {
                const { data, error } = await supabaseClient.from(table).upsert(item).select().single();
                if(error) throw error;
                return data;
            },
            insert: async (table, item) => {
                const { data, error } = await supabaseClient.from(table).insert(item).select().single();
                if(error) throw error;
                return data;
            },
            delete: async (table, id) => {
                 await supabaseClient.from(table).update({ status: 'deleted' }).eq('id', id);
            },
            logAction: async (action, details, admin_id) => {
                 await supabaseClient.from('audit_logs').insert({ action, details, admin_id });
            },
            getNextLuckyNumberSeq: async () => {
                const { data } = await supabaseClient.from('lucky_numbers').select('id').order('id', {ascending: false}).limit(1);
                 return data && data.length > 0 ? parseInt(data[0].id) + 1 : 1;
            },
            getGlobalRanking: async () => {
                const users = await DB.getAll('users');
                const numbers = await DB.getAll('lucky_numbers');
                const sales = await DB.getAll('sales');
                const agencies = await DB.getAll('agencies');
                
                const userCounts = {};
                numbers.forEach(n => { userCounts[n.user_id] = (userCounts[n.user_id] || 0) + 1; });

                const userValues = {};
                sales.forEach(s => { userValues[s.user_id] = (userValues[s.user_id] || 0) + s.value; });

                const agencyMap = Object.fromEntries(agencies.map(a => [a.id, a.name]));

                let rank = users.filter(u => u.role === 'seller' && u.status === 'active').map(u => ({
                    ...u,
                    agencyName: agencyMap[u.agency_id] || 'Desconhecida',
                    totalNumbers: userCounts[u.id] || 0,
                    totalValue: userValues[u.id] || 0
                }));
                rank.sort((a, b) => b.totalNumbers - a.totalNumbers || b.totalValue - a.totalValue);
                return rank.map((u, i) => ({...u, position: i + 1}));
            },
            getAgencyRanking: async () => {
                const agencies = await DB.getAll('agencies');
                const numbers = await DB.getAll('lucky_numbers');
                const users = await DB.getAll('users');
                const sales = await DB.getAll('sales');
                
                const agencyCounts = {};
                numbers.forEach(n => { agencyCounts[n.agency_id] = (agencyCounts[n.agency_id] || 0) + 1; });

                const agencyValues = {};
                sales.forEach(s => { agencyValues[s.agency_id] = (agencyValues[s.agency_id] || 0) + s.value; });

                const userCounts = {};
                users.filter(u => u.role === 'seller').forEach(u => {
                    userCounts[u.agency_id] = (userCounts[u.agency_id] || 0) + 1;
                });

                let rank = agencies.filter(a => a.status === 'active').map(a => ({
                    ...a,
                    totalNumbers: agencyCounts[a.id] || 0,
                    totalValue: agencyValues[a.id] || 0,
                    participants: userCounts[a.id] || 0
                }));
                rank.sort((a, b) => b.totalNumbers - a.totalNumbers || b.totalValue - a.totalValue);
                return rank.map((a, i) => ({...a, position: i + 1}));
            }
        };

        // =====================================================
        // UTILS & EFEITOS
        // =====================================================
        const Utils = {
            formatDate: (dateStr) => {
                const d = new Date(dateStr);
                return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
            },
            formatCurrency: (value) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value),
            showToast: (msg, type = 'success') => {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = 'toast';
                if(type === 'error') {
                    toast.style.borderLeftColor = 'var(--red-accent)';
                    toast.style.background = '#8b0000';
                }
                toast.textContent = msg;
                container.appendChild(toast);
                setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
            },
            getInitials: (name) => {
                const parts = name.split(' ');
                return parts.length > 1 ? (parts[0][0] + parts[parts.length-1][0]).toUpperCase() : parts[0].substring(0,2).toUpperCase();
            },
            formatTicketNumber: (num) => String(num).padStart(5, '0'),
            playSound: (filename) => {
                try {
                    const audio = new Audio(filename);
                    audio.play().catch(() => {});
                } catch(e) {}
            }
        };

        const Confetti = {
            trigger: () => {
                const colors = ['#d4af37', '#ffdf73', '#ffffff', '#0d1f74', '#4282a9'];
                for (let i = 0; i < 120; i++) {
                    const conf = document.createElement('div');
                    conf.style.position = 'fixed';
                    conf.style.width = (Math.random() * 8 + 6) + 'px';
                    conf.style.height = (Math.random() * 5 + 4) + 'px';
                    conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    conf.style.top = '-20px';
                    conf.style.left = Math.random() * 100 + 'vw';
                    conf.style.opacity = Math.random() + 0.5;
                    conf.style.zIndex = '100000';
                    conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    document.body.appendChild(conf);

                    const fallDuration = Math.random() * 3 + 2.5; 
                    const xOffset = (Math.random() - 0.5) * 300; 

                    conf.animate([
                        { transform: `translate3d(0,0,0) rotate(0deg)`, opacity: 1 },
                        { transform: `translate3d(${xOffset}px, 100vh, 0) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                    ], { duration: fallDuration * 1000, easing: 'cubic-bezier(.37,0,.63,1)', fill: 'forwards' });
                    setTimeout(() => conf.remove(), fallDuration * 1000);
                }
            }
        };

        // =====================================================
        // COMPONENTES DE INTERFACE
        // =====================================================
        const UI = {

                const sb = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebar-overlay');
                sb.classList.toggle('open');
                overlay.classList.toggle('active');
            },
            closeSidebar: () => {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebar-overlay').classList.remove('active');
            },
            showModal: (title, contentHTML, buttons = []) => {
                const overlay = document.getElementById('custom-modal');
                document.getElementById('modal-title').innerHTML = title;
                document.getElementById('modal-content').innerHTML = contentHTML;
                const actions = document.getElementById('modal-actions');
                actions.innerHTML = '';
                
                if(buttons.length === 0) buttons.push({ text: 'Fechar', class: 'btn btn-outline', onClick: () => UI.closeModal() });
                buttons.forEach(btn => {
                    const b = document.createElement('button');
                    b.className = btn.class || 'btn'; b.textContent = btn.text; b.onclick = btn.onClick; actions.appendChild(b);
                });
                overlay.classList.remove('hidden');
            },
            closeModal: () => document.getElementById('custom-modal').classList.add('hidden'),
            confirm: (title, text, onConfirm) => {
                UI.showModal(title, `<p class="text-center font-bold text-blue-dark">${text}</p>`, [
                    { text: 'Cancelar', class: 'btn btn-outline', onClick: () => UI.closeModal() },
                    { text: 'Confirmar', class: 'btn', onClick: () => { UI.closeModal(); onConfirm(); } }
                ]);
            },
            alert: (title, text) => {
                UI.showModal(title, `<p class="text-center">${text}</p>`, [{ text: 'OK', class: 'btn', onClick: () => UI.closeModal() }]);
            },
            navigate: async (viewName) => {
                UI.closeSidebar(); 
                const content = document.getElementById('main-content');
                content.innerHTML = '<div class="text-center text-gold mt-3 font-bold">Carregando...</div>';
                
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                const activeLink = Array.from(document.querySelectorAll('.nav-item')).find(el => el.getAttribute('onclick') && el.getAttribute('onclick').includes(viewName));
                if(activeLink) activeLink.classList.add('active');

                try {
                    switch(viewName) {
                        case 'seller-dashboard': content.innerHTML = await Renderers.sellerDashboard(); break;
                        case 'seller-numbers': content.innerHTML = await Renderers.sellerNumbers(); break;
                        case 'global-ranking': content.innerHTML = await Renderers.globalRanking(); break;
                        case 'agency-ranking': content.innerHTML = await Renderers.agencyRanking(); break;
                        case 'product-ranking': content.innerHTML = await Renderers.productRanking(); break;
                        case 'my-agency': content.innerHTML = await Renderers.myAgency(); break;
                        case 'drawn-numbers': content.innerHTML = await Renderers.drawnNumbers(); break;
                        case 'admin-dashboard': content.innerHTML = await Renderers.adminDashboard(); break;
                        case 'admin-launch-sale': content.innerHTML = await Renderers.adminLaunchSale(); break;
                        case 'admin-draw': content.innerHTML = await Renderers.adminDraw(); break;
                        case 'admin-history': content.innerHTML = await Renderers.adminHistory(); break;
                        case 'admin-settings': content.innerHTML = await Renderers.adminSettings(); break;
                        default: content.innerHTML = '<h2>Página não encontrada</h2>';

                    console.error(e); content.innerHTML = `<h3 style="color:red">Erro ao carregar tela.</h3>`;
                }
            },
            renderPodium: (top3) => {
                if(!top3 || top3.length === 0) return '';
                return `
                    <div class="card animate-fade" style="margin-bottom: 30px; background: linear-gradient(180deg, #ffffff 0%, #f9f9fa 100%);">
                        <h3 class="text-center text-gold" style="position: relative; z-index: 10; margin-bottom: 3.13rem;">👑 PÓDIO ATUAL</h3>
                        <div class="flex justify-center items-end gap-3" style="margin-top: 40px; height: 160px; padding-bottom: 10px;">
                            ${top3[1] ? `<div class="text-center" style="transform: translateY(-20px)"><div class="pos-badge" style="margin: 0 auto 10px;">2</div><div class="avatar" style="margin: 0 auto; width:60px;height:60px;"><span>${Utils.getInitials(top3[1].name)}</span></div><div class="rank-name mt-2">${top3[1].name.split(' ')[0]}</div><div class="text-gold font-bold">${top3[1].totalNumbers} Nrs</div><div style="font-size: 0.7em; color: var(--text-muted); font-weight: bold;">${Utils.formatCurrency(top3[1].totalValue)}</div></div>` : ''}
                            ${top3[0] ? `<div class="text-center" style="transform: translateY(-50px)"><div class="pos-badge" style="margin: 0 auto 10px; width:60px;height:60px; font-size:1.5em;">1</div><div class="avatar" style="margin: 0 auto; width:80px;height:80px; border-width:3px;"><span>${Utils.getInitials(top3[0].name)}</span></div><div class="rank-name mt-2" style="font-size:1.2em;">${top3[0].name.split(' ')[0]}</div><div class="text-gold font-bold" style="font-size:1.3em;">${top3[0].totalNumbers} Nrs</div><div style="font-size: 0.7em; color: var(--text-muted); font-weight: bold;">${Utils.formatCurrency(top3[0].totalValue)}</div></div>` : ''}
                            ${top3[2] ? `<div class="text-center" style="transform: translateY(0px)"><div class="pos-badge" style="margin: 0 auto 10px;">3</div><div class="avatar" style="margin: 0 auto; width:50px;height:50px;"><span>${Utils.getInitials(top3[2].name)}</span></div><div class="rank-name mt-2">${top3[2].name.split(' ')[0]}</div><div class="text-gold font-bold">${top3[2].totalNumbers} Nrs</div><div style="font-size: 0.7em; color: var(--text-muted); font-weight: bold;">${Utils.formatCurrency(top3[2].totalValue)}</div></div>` : ''}
                        </div>
                    </div>
                `;
            }
        };

        // =====================================================
        // ESTADO E AUTENTICAÇÃO (INTEGRADO AO SUPABASE AUTH)
        // =====================================================
        const App = {
            currentUser: null,
            
            async init() {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if(session) {
                    const user = await DB.getById('users', session.user.id);
                    if(user && user.status === 'active') {
                        this.currentUser = user;
                        this.verifyLoginRoutine();
                    } else {
                        this.logout();
                    }
                }
            },

            async login(e) {
                e.preventDefault();
                const btn = document.getElementById('btn-login-submit');
                btn.disabled = true; btn.textContent = 'Acessando...';

                let loginInput = document.getElementById('login-user').value.trim().toLowerCase();
                const passInput = document.getElementById('login-pass').value.trim();

                let email = loginInput.includes('@') ? loginInput : `${loginInput}@conquista.app`;

                const { data, error } = await supabaseClient.auth.signInWithPassword({ email: email, password: passInput });

                if (error || !data.user) {
                    Utils.showToast('Login/Matrícula ou senha incorretos!', 'error');
                    btn.disabled = false; btn.textContent = 'Entrar na Campanha';
                    return;
                }

                const user = await DB.getById('users', data.user.id);
                if (user && user.status === 'active') {
                    this.currentUser = user;
                    this.verifyLoginRoutine();
                } else {
                    Utils.showToast('Seu acesso está inativo.', 'error');
                    this.logout();
                }
                
                btn.disabled = false; btn.textContent = 'Entrar na Campanha';
            },

            async verifyLoginRoutine() {
    if (this.currentUser.must_change_password) {
        UI.showModal('🔒 Alterar Senha Provisória', `
            <p class="text-center text-blue-dark" style="margin-bottom: 20px;">Por favor, crie uma nova senha de no mínimo 6 dígitos para o seu acesso seguro.</p>
            <div class="input-group"><input type="password" id="new-pwd" class="w-full" placeholder="Nova Senha"></div>
            <div class="input-group"><input type="password" id="confirm-pwd" class="w-full" placeholder="Confirmar Senha"></div>
        `, [
            { 
                text: 'Salvar e Entrar', 
                class: 'btn', 
                onClick: async () => {
                    const np = document.getElementById('new-pwd').value;
                    const cp = document.getElementById('confirm-pwd').value;
                    
                    if(!np || np !== cp) return Utils.showToast('As senhas não conferem!', 'error');
                    if(np.length < 6) return Utils.showToast('A senha precisa ter no mínimo 6 dígitos!', 'error');
                    
                    const { error } = await supabaseClient.auth.updateUser({ password: np });
                    if (error) return Utils.showToast('Erro ao atualizar senha no servidor.', 'error');

                    const { error: dbError } = await supabaseClient.from('users')
                        .update({ must_change_password: false })
                        .eq('id', this.currentUser.id);
                        
                    if (dbError) return Utils.showToast('Erro ao confirmar nova senha.', 'error');

                    this.currentUser.must_change_password = false;
                    
                    UI.closeModal();
                    this.loadApp();
                }
            },
            { 
                text: 'Cancelar', 
                class: 'btn btn-outline', 
                onClick: () => {
                    UI.closeModal();
                    // Desloga o usuário, já que ele não pode prosseguir sem trocar a senha
                    this.logout();
                }
            }
        ]);
    } else {
        this.loadApp();
    }
},
            async logout() {
                await supabaseClient.auth.signOut();
                this.currentUser = null;
                document.getElementById('app').classList.add('hidden');
                document.getElementById('view-login').classList.remove('hidden');
                document.getElementById('login-pass').value = '';
            },

            async loadApp() {
                document.getElementById('view-login').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                
                document.getElementById('topbar-name').textContent = this.currentUser.name;
                document.getElementById('topbar-name').style.display = 'block';
                document.getElementById('topbar-avatar').innerHTML = `<span>${Utils.getInitials(this.currentUser.name)}</span>`;

                this.buildMenu();
                
                if(this.currentUser.role === 'admin') {
                    UI.navigate('admin-dashboard');
                } else {
                    UI.navigate('seller-dashboard');
                    this.checkWinnerStatus();
                }
            },

            async checkWinnerStatus() {
                const numbers = await DB.getByIndex('lucky_numbers', 'user_id', this.currentUser.id);
                const wonNumbers = numbers.filter(n => n.status === 'drawn' && !n.winner_notified);
                
                if(wonNumbers.length > 0) {
                    Utils.playSound('win.mp3'); Confetti.trigger();
                    
                    const numsStr = wonNumbers.map(n => n.id).join(', ');
                    UI.showModal('🎉 VOCÊ FOI SORTEADO! 🎉', `
                        <div class="text-center">
                            <div style="font-size: 4em; margin-bottom: 20px;">🏆</div>
                            <h3 class="text-gold" style="font-size: 1.5em; margin-bottom: 10px;">Parabéns, ${this.currentUser.name}!</h3>
                            <p class="font-bold text-blue-dark">Seus seguintes números da sorte foram premiados:</p>
                            <div style="font-size: 2.5em; font-weight: bold; font-family: monospace; color: var(--gold); margin: 20px 0; background: rgba(212,175,55,0.1); border: 1px dashed var(--gold); padding: 15px; border-radius: 8px;">
                                ${numsStr}
                            </div>
                            <p style="color: var(--text-muted)">Acesse "Meus Números" para visualizar os detalhes do seu bilhete dourado!</p>
                        </div>
                    `, [{ text: 'Comemorar Conquista!', class: 'btn', onClick: () => { UI.closeModal(); UI.navigate('seller-numbers'); } }]);

                    for(let n of wonNumbers) {
                        n.winner_notified = true;
                        await DB.save('lucky_numbers', n);

            buildMenu() {
                const sb = document.getElementById('sidebar');

                    sb.innerHTML = `
                        <a class="nav-item" onclick="UI.navigate('admin-dashboard')">🏠 Dashboard</a>
                        <a class="nav-item" onclick="UI.navigate('admin-launch-sale')">➕ Lançar Venda</a>

                        <a class="nav-item" onclick="UI.navigate('product-ranking')">📦 Ranking por Produto</a>

                        <a class="nav-item" onclick="UI.navigate('admin-settings')">⚙️ Configurações</a>
                        <a class="nav-item" style="color: #ff9999" onclick="App.logout()">🚪 Sair</a>
                        <p class="copy">&#169 2026 Números da Sorte v1.0<br>Todos os direitos reservados<br>Maykow Roberto c097419</p>
                    `;
                } else {
                    sb.innerHTML = `
                        <a class="nav-item" onclick="UI.navigate('seller-dashboard')">🏠 Início</a>
                        <a class="nav-item" onclick="UI.navigate('seller-numbers')">🎟️ Meus Números</a>
                        <a class="nav-item" onclick="UI.navigate('global-ranking')">🏆 Ranking Geral</a>
                        <a class="nav-item" onclick="UI.navigate('product-ranking')">📦 Ranking por Produto</a>
                        <a class="nav-item" onclick="UI.navigate('my-agency')">🏢 Minha Agência</a>
                        <a class="nav-item" onclick="UI.navigate('drawn-numbers')">🎉 Números Sorteados</a>
                        <a class="nav-item" style="color: #ff9999" onclick="App.logout()">🚪 Sair</a>
                        <p class="copy">&#169 2026 Números da Sorte v1.0<br>Todos os direitos reservados<br>Maykow Roberto c097419</p>
                    `;
                }
            }
        };

        // =====================================================
        // RENDERIZADORES
        // =====================================================
        const Renderers = {
            async sellerDashboard() {
                const user = App.currentUser;
                const numbers = await DB.getByIndex('lucky_numbers', 'user_id', user.id);
                const rank = await DB.getGlobalRanking();
                const myRank = rank.find(r => r.id === user.id);
                const pos = myRank ? myRank.position : '-';
                const totalVal = myRank ? myRank.totalValue : 0;
                
                const agRank = await DB.getAgencyRanking();
                const myAgRank = agRank.find(a => a.id === user.agency_id);
                const agPos = myAgRank ? myAgRank.position : '-';

                let msg = "Venda produtos para conquistar números da sorte!";
                if(pos <= 3) msg = "🏆 Sensacional! Você está no pódio global!";
                else if (pos <= 10) msg = "🔥 Top 10! Continue acelerando!";
                else if (numbers.length > 0) msg = "🚀 Você está no jogo! Continue vendendo!";

                return `
                    <div class="gamification-banner"><span>${msg}</span></div>
                    <div class="grid-stats animate-fade">
                        <div class="card stat-card"><div class="stat-label">Meus Números</div><div class="stat-value">${numbers.length}</div></div>
                        <div class="card stat-card"><div class="stat-label">Total Vendido</div><div class="stat-value" style="font-size: 2em; color: var(--gold);">${Utils.formatCurrency(totalVal)}</div></div>
                        <div class="card stat-card"><div class="stat-label">Posição Geral</div><div class="stat-value">${pos}º</div></div>
                        <div class="card stat-card"><div class="stat-label">Minha Agência</div><div class="stat-value">${agPos}º <span style="font-size: 0.3em;">LUGAR</span></div></div>
                    </div>
                    <h2 class="section-title">Últimos Números Conquistados</h2>
                    <div class="tickets-grid">
                        ${numbers.slice(-6).reverse().map(n => `
                            <div class="ticket ${n.status === 'drawn' ? 'ticket-winner' : ''}">
                                <div class="ticket-num">${n.id}</div>
                                <div class="ticket-prod">${n.status === 'drawn' ? '★ PREMIADO ★' : Utils.formatDate(n.date).split(' ')[0]}</div>
                            </div>
                        `).join('')}
                    </div>
                    ${numbers.length > 6 ? `<div class="text-center mt-3"><button class="btn btn-outline" onclick="UI.navigate('seller-numbers')">Ver todos</button></div>` : ''}
                `;
            },

            async sellerNumbers() {
                const user = App.currentUser;
                const numbers = await DB.getByIndex('lucky_numbers', 'user_id', user.id);
                const products = await DB.getAll('products');
                const balances = await DB.getAll('balances');
                
                const prodMap = Object.fromEntries(products.map(p => [p.id, p.name]));
                const myBalances = balances.filter(b => b.user_id === user.id && b.balance > 0);
                const toShow = numbers.reverse().slice(0, 100); 

                let balanceHtml = '';
                if(myBalances.length > 0) {
                    balanceHtml = `
                        <div class="card animate-fade" style="margin-bottom: 25px; border-top: 4px solid var(--blue-light);">
                            <h3 class="text-blue-dark" style="font-size: 1.2em; margin-bottom: 15px;">💰 Saldos Acumulados (Frações de Vendas)</h3>
                            <div class="grid-stats" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px;">
                                ${myBalances.map(b => {
                                    const p = products.find(x => x.id === b.product_id);
                                    if(!p) return '';
                                    const missing = p.target_value - b.balance;
                                    return `
                                        <div style="background: var(--bg-dark); padding: 15px; border-radius: 8px; border: 1px solid var(--border-glow);">
                                            <div style="font-weight: bold; color: var(--blue-dark); margin-bottom: 5px; text-transform: uppercase; font-size: 0.9em;">${p.name}</div>
                                            <div style="color: var(--gold); font-size: 1.4em; font-weight: 800;">${Utils.formatCurrency(b.balance)}</div>
                                            <div style="font-size: 0.85em; color: var(--text-muted); margin-top: 5px; font-weight: 600;">Faltam ${Utils.formatCurrency(missing)} para ganhar +${p.numbers_granted} nº(s)</div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                }

                return `
                    <h2 class="section-title">🎟️ Meus Números da Sorte</h2>
                    ${balanceHtml}
                    <p style="margin-bottom: 20px; font-weight: 600; color: var(--blue-dark);">Você possui <strong>${numbers.length}</strong> números da sorte conquistados.</p>
                    <div class="tickets-grid animate-fade">
                        ${toShow.length === 0 ? '<p>Nenhum número conquistado ainda.</p>' : toShow.map(n => `
                            <div class="ticket ${n.status === 'drawn' ? 'ticket-winner' : ''}">
                                <div class="ticket-num">${n.id}</div>
                                <div class="ticket-prod">${n.status === 'drawn' ? '🏆 PREMIADO' : (prodMap[n.product_id] || 'Produto')}<br>${Utils.formatDate(n.date)}</div>
                            </div>

                    </div>
                `;

            async globalRanking() {
                const rank = await DB.getGlobalRanking();
                const top3 = rank.slice(0, 3);
                
                return `
                    <h2 class="section-title">🏆 Ranking Geral</h2>

                                    <div class="rank-score">

            async agencyRanking() {
                const rank = await DB.getAgencyRanking();
                return `
                    <h2 class="section-title">🏢 Ranking de Agências</h2>
                    <div class="card animate-fade">
                        <div class="ranking-list">
                            ${rank.map((a, i) => `
                                <div class="ranking-item ${i < 3 ? 'top-'+(i+1) : ''}">
                                    <div class="pos-badge">${a.position}</div>
                                    <div class="rank-info" style="margin-left: 15px;">
                                        <div class="rank-name">${a.name} (${a.code})</div>
                                        <div class="rank-agency">${a.participants} participantes vinculados</div>
                                    </div>
                                    <div class="rank-score">
                                        <div class="rank-score-val">${Utils.formatCurrency(a.totalValue)}</div>
                                        <div class="rank-score-num">${a.totalNumbers} Nrs</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            },

            async productRanking() {
                const products = await DB.getAll('products');
                const sales = await DB.getAll('sales');
                const users = await DB.getAll('users');
                const userMap = Object.fromEntries(users.map(u => [u.id, u.name]));
                const activeProds = products.filter(p => p.status === 'active');

                let html = `<h2 class="section-title">📦 Ranking por Produto</h2>`;

                for(let p of activeProds) {
                    const pSales = sales.filter(s => s.product_id === p.id);
                    const uStats = {};
                    pSales.forEach(s => {
                        if(!uStats[s.user_id]) uStats[s.user_id] = { value: 0, nums: 0 };
                        uStats[s.user_id].value += s.value;
                        uStats[s.user_id].nums += s.numbers_generated;
                    });

                    const rank = Object.keys(uStats).map(uid => ({
                        user_id: uid, name: userMap[uid] || 'Desconhecido', value: uStats[uid].value, nums: uStats[uid].nums
                    })).sort((a,b) => b.value - a.value).slice(0, 10); 

                    html += `

            async adminLaunchSale() {
                const users = await DB.getAll('users');
                const products = await DB.getAll('products');
                
                const sellers = users.filter(u => u.role === 'seller' && u.status === 'active').sort((a,b) => a.name.localeCompare(b.name));
                const prodsActive = products.filter(p => p.status === 'active');

                window.calcPreviewNumbers = async () => {
                    const uId = document.getElementById('sale-user').value;
                    const pId = document.getElementById('sale-product').value;
                    const val = parseFloat(document.getElementById('sale-value').value.replace(',', '.') || 0);

                    if(!uId || !pId || val <= 0) { document.getElementById('sale-preview').innerHTML = ''; return; }
                    
                    const p = prodsActive.find(x => x.id === pId);
                    const balRecord = await DB.getById('balances', uId + '_' + pId);
                    const currentBalance = balRecord ? balRecord.balance : 0;

                    const totalAvailable = currentBalance + val;
                    const nums = Math.floor(totalAvailable / p.target_value) * p.numbers_granted;
                    const newBalance = totalAvailable % p.target_value;

                    document.getElementById('sale-preview').innerHTML = `
                        <div style="background: var(--bg-dark); padding: 20px; border-radius: 8px; border: 1px dashed var(--blue-light); text-align: center; margin-bottom: 20px;">
                            <div class="flex justify-between" style="font-size: 0.85em; color: var(--blue-dark); margin: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 5px;">
                                <span>Saldo Anterior:</span> <strong>${Utils.formatCurrency(currentBalance)}</strong>
                            </div>
                            <div class="flex justify-between" style="font-size: 0.85em; color: var(--blue-dark); margin: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 5px;">
                                <span>Valor Nova Venda:</span> <strong>${Utils.formatCurrency(val)}</strong>
                            </div>
                            <span style="font-size: 1.8em; font-weight: 800; color: var(--gold); display: block; margin: 15px 0; background: #ffffff; border-radius: 8px; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">+${nums} NÚMEROS</span>
                            <div style="font-size: 0.9em; color: var(--blue-dark); background: #e3f2fd; padding: 8px; border-radius: 4px; font-weight: 600;">Novo Saldo (Fração): ${Utils.formatCurrency(newBalance)}</div>
                        </div>
                    `;
                };

                window.processSale = async (e) => {
                    e.preventDefault();
                    const btn = document.getElementById('btn-confirm-sale');
                    btn.disabled = true; btn.textContent = 'Processando...';

                    try {
                        const uId = document.getElementById('sale-user').value;
                        const pId = document.getElementById('sale-product').value;
                        const val = parseFloat(document.getElementById('sale-value').value.replace(',', '.'));
                        
                        const u = sellers.find(x => x.id === uId);
                        const p = prodsActive.find(x => x.id === pId);

                        const balanceId = uId + '_' + pId;
                        const balRecord = await DB.getById('balances', balanceId);
                        const currentBalance = balRecord ? balRecord.balance : 0;

                        const totalAvailable = currentBalance + val;
                        const totalNums = Math.floor(totalAvailable / p.target_value) * p.numbers_granted;
                        const newBalance = totalAvailable % p.target_value;

                        const sale = await DB.insert('sales', { user_id: u.id, agency_id: u.agency_id, product_id: p.id, value: val, numbers_generated: totalNums, admin_id: App.currentUser.id });
                        await DB.save('balances', { id: balanceId, user_id: u.id, product_id: p.id, balance: newBalance });

                        let startSeq = await DB.getNextLuckyNumberSeq();
                        const newNumbers = [];
                        for(let i=0; i<totalNums; i++) {
                            newNumbers.push({
                                id: Utils.formatTicketNumber(startSeq++),
                                user_id: u.id, agency_id: u.agency_id, product_id: p.id, sale_id: sale.id, status: 'active', winner_notified: false
                            });
                        }
                        if(newNumbers.length > 0) await supabaseClient.from('lucky_numbers').insert(newNumbers);

                        await DB.logAction('SALE_ADDED', `Lançamento R$ ${val} em ${p.name} para ${u.name}. Gerados ${totalNums} números.`, App.currentUser.id);
                        Utils.showToast(`Lançamento realizado! ${totalNums} números gerados para ${u.name}!`);
                        UI.navigate('admin-launch-sale'); 
                    } catch (error) {
                        Utils.showToast("Erro ao lançar venda.", "error");
                        btn.disabled = false; btn.textContent = 'Confirmar Lançamento';
                    }
                };

                return `
                    <h2 class="section-title">➕ Lançar Venda</h2>
                    <div class="card animate-fade" style="max-width: 600px; margin: 0 auto; border-top: 4px solid var(--gold);">
                        <form onsubmit="processSale(event)">
                            <div class="input-group">
                                <label>Participante</label>
                                <select id="sale-user" required onchange="calcPreviewNumbers()">
                                    <option value="">Selecione...</option>
                                    ${sellers.map(u => `<option value="${u.id}">${u.name} (Mat: ${u.login})</option>`).join('')}
                                </select>
                            </div>
                            <div class="input-group">
                                <label>Produto Vendido</label>
                                <select id="sale-product" required onchange="calcPreviewNumbers()">
                                    <option value="">Selecione...</option>
                                    ${prodsActive.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
                                </select>
                            </div>
                            <div class="input-group">
                                <label>Valor Vendido (R$)</label>
                                <input type="number" step="0.01" id="sale-value" min="0.01" required onkeyup="calcPreviewNumbers()" onchange="calcPreviewNumbers()">
                            </div>
                            <div id="sale-preview"></div>
                            <button type="submit" id="btn-confirm-sale" class="btn w-full text-blue-dark">Confirmar Lançamento</button>
                        </form>
                    </div>
                `;
            },

            async adminDraw() {
                const lns = await DB.getAll('lucky_numbers');
                const actives = lns.filter(n => n.status === 'active');

                window.startDraw = async () => {
                    if(actives.length === 0) return UI.alert('Aviso', 'Não há números válidos para sorteio neste momento.');
                    
                    UI.confirm('Iniciar Sorteio Oficial?', 'Esta ação não poderá ser desfeita', async () => {
                        Utils.playSound('tadaa.mp3');
                        
                        const btn = document.getElementById('btn-draw'); btn.style.display = 'none';
                        const numDisplay = document.getElementById('draw-num-display');
                        const winnerCard = document.getElementById('winner-card');
                        winnerCard.classList.remove('show');

                        let counter = 0;
                        let interval = setInterval(() => {
                            numDisplay.textContent = Utils.formatTicketNumber(Math.floor(Math.random() * 99999));
                            counter++;
                            if(counter > 30) { clearInterval(interval); processWinner(); }
                        }, 100);

                        const processWinner = async () => {
                            const winnerNum = actives[Math.floor(Math.random() * actives.length)];
                            
                            winnerNum.status = 'drawn'; winnerNum.winner_notified = false; 
                            await DB.save('lucky_numbers', winnerNum);
                            await DB.insert('draws', { lucky_number: winnerNum.id, user_id: winnerNum.user_id, agency_id: winnerNum.agency_id, admin_id: App.currentUser.id });
                            
                            const u = await DB.getById('users', winnerNum.user_id);
                            const a = await DB.getById('agencies', winnerNum.agency_id);
                            const p = await DB.getById('products', winnerNum.product_id);

                            await DB.logAction('DRAW_PERFORMED', `Sorteio do número ${winnerNum.id} de ${u.name}.`, App.currentUser.id);

                            numDisplay.textContent = winnerNum.id; numDisplay.style.color = 'var(--gold)'; numDisplay.style.animation = 'pulseWinner 1s infinite';
                            document.getElementById('w-name').textContent = u.name;
                            document.getElementById('w-agency').textContent = a ? a.name : 'Desconhecida';
                            document.getElementById('w-prod').textContent = `Origem: ${p.name}`;

                            winnerCard.classList.add('show');
                            btn.style.display = 'inline-flex'; btn.textContent = 'Realizar Novo Sorteio';
                            Confetti.trigger();
                        };
                    });
                };

                return `
                    <h2 class="section-title">🎰 Painel de Sorteio</h2>
                    <div class="card animate-fade text-center" style="margin-bottom: 20px;">
                        <p class="text-blue-dark font-bold">Números Válidos: <strong class="text-gold" style="font-size: 1.5em;">${actives.length}</strong></p>
                    </div>
                    <div class="draw-container animate-fade">
                        <div class="draw-box" id="draw-anim-box"><div class="draw-number" id="draw-num-display">00000</div></div>
                        <div id="winner-card" class="winner-card card" style="text-align:center; border: 3px solid var(--gold); margin-bottom: 30px;">
                            <h3 style="color: var(--blue-dark); font-weight: 800;">🎉 NÚMERO PREMIADO! 🎉</h3>
                            <div id="w-name" style="font-size: 1.6em; font-weight: bold; margin: 15px 0; color: var(--gold);"></div>
                            <div id="w-agency" class="text-blue-dark font-bold"></div>
                            <div id="w-prod" style="font-size: 0.9em; margin-top: 15px; color: var(--text-muted); background: #f2f2f4; padding: 5px;"></div>
                        </div>
                        <button id="btn-draw" class="btn" style="font-size: 1.3em; padding: 15px 40px;" onclick="startDraw()">🎰 SORTEAR NÚMERO</button>
                    </div>
                `;
            },

                            if(error) return Utils.showToast('Erro: ' + error.message, 'error');

                            await DB.logAction('USER_ADDED', `Usuário ${name} (Mat: ${login}) cadastrado.`, App.currentUser.id);
                            UI.closeModal(); UI.navigate('admin-settings'); Utils.showToast('Usuário Cadastrado!');
                        }},
                        { text: 'Cancelar', class: 'btn btn-outline', onClick: () => UI.closeModal() }
                    ]);
                };

                window.deleteGeneric = (table, id, name) => {
                    UI.confirm('Excluir', `Deseja excluir <b>${name}</b>?`, async () => {
                        await DB.delete(table, id);
                        UI.navigate('admin-settings'); Utils.showToast('Removido com Sucesso!');
                    });
                };

                // ---------- RENDER TABELAS COM BOTÕES EDITAR/DELETAR ----------
                return `
                    <h2 class="section-title">⚙️ Configurações</h2>
                    <div class="config-grid animate-fade">
                        <div class="card" style="display: flex; flex-direction: column;">
                            <div class="flex justify-between items-center mb-3"><h3 class="text-blue-dark">📦 Produtos</h3><button class="btn btn-outline btn-sm" onclick="openAddProduct()">+ Novo</button></div>
                            <div class="table-responsive" style="flex: 1;"><table class="responsive-table"><tbody>
                                ${activeProds.map(p => `
                                    <tr>
                                        <td class="font-bold">${p.name}</td>
                                        <td>A cada ${Utils.formatCurrency(p.target_value)} = ${p.numbers_granted} nºs</td>
                                        <td class="actions-cell">
                                            <button class="btn-icon edit" onclick="openEditProduct('${p.id}')" title="Editar">✏️</button>
                                            <button class="btn-icon delete" onclick="deleteGeneric('products', '${p.id}', '${p.name}')" title="Excluir">✗</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody></table></div>
                        </div>

                        <div class="card" style="display: flex; flex-direction: column;">
                            <div class="flex justify-between items-center mb-3"><h3 class="text-blue-dark">🏢 Agências</h3><button class="btn btn-outline btn-sm" onclick="openAddAgency()">+ Nova</button></div>
                            <div class="table-responsive" style="flex: 1;"><table class="responsive-table"><tbody>
                                ${activeAgencies.map(a => `
                                    <tr>
                                        <td class="font-bold text-blue-light">${a.code}</td>
                                        <td>${a.name}</td>
                                        <td class="actions-cell">
                                            <button class="btn-icon edit" onclick="openEditAgency('${a.id}')" title="Editar">✏️</button>
                                            <button class="btn-icon delete" onclick="deleteGeneric('agencies', '${a.id}', '${a.name}')" title="Excluir">✗</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody></table></div>
                        </div>

                        <div class="card" style="display: flex; flex-direction: column;">
                            <div class="flex justify-between items-center mb-3"><h3 class="text-blue-dark">👥 Usuários</h3><button class="btn btn-outline btn-sm" onclick="openAddUser()">+ Novo</button></div>
                            <div class="table-responsive" style="flex: 1;"><table class="responsive-table"><tbody>
                                ${activeUsers.map(u => `
                                    <tr>
                                        <td class="font-bold">${u.name}</td>
                                        <td>${u.login}</td>
                                        <td>${u.role === 'admin' ? '<span class="text-gold">Admin</span>' : 'Vendedor'}</td>
                                        <td>${u.id !== App.currentUser.id ? `<button class="btn-icon delete" onclick="deleteGeneric('users', '${u.id}', '${u.name}')" title="Inativar">✗</button>` : 'Você'}</td>
                                    </tr>
                                `).join('')}
                            </tbody></table></div>
                        </div>
                    </div>
                `;
            }
        };

        window.onload = () => App.init();
    </script>
</body>
</html>
