                    UI.showModal('<i class="ti ti-pencil"></i> Editar Agência', `
                        <div class="input-group"><label>Nome</label><input type="text" id="edit-ag-name" value="${a.name}"></div>
                        <div class="input-group"><label>Código (4 dgt)</label><input type="text" id="edit-ag-code" maxlength="4" value="${a.code}"></div>
                    `, [
                        { text: '<i class="ti ti-check"></i> Salvar', class: 'btn', onClick: async () => {
                            const name = document.getElementById('edit-ag-name').value.trim(); const code = document.getElementById('edit-ag-code').value.trim();
                            if(!name || !code) return Utils.showToast('Preencha os campos', 'error');
                            await DB.save('agencies', { ...a, name, code }); UI.closeModal(); UI.navigate('admin-settings'); Utils.showToast('Agência Atualizada!');
                        }},
                        { text: 'Cancelar', class: 'btn btn-outline', onClick: () => UI.closeModal() }
                    ]);
                };

                window.openAddUser = () => {
                    if (!Utils.checkPermission()) return;
                    const agencyOptions = activeAgencies.map(a => `<option value="${a.id}">${a.name} (${a.code})</option>`).join('');
                    UI.showModal('<i class="ti ti-user-plus"></i> Novo Usuário', `
                        <div class="input-group"><label>Nome Completo</label><input type="text" id="u-name"></div>
                        <div class="input-group"><label>Matrícula / Login</label><input type="text" id="u-mat"></div>
                        <div class="input-group" id="u-ag-container"><label>Agência</label><select id="u-ag"><option value="">Selecione...</option>${agencyOptions}</select></div>
                        <div class="input-group"><label>Senha Provisória (Mín 6 Dgts)</label><input type="password" id="u-pwd"></div>
                        <div class="input-group"><label>Perfil de Acesso</label>
                            <select id="u-role" onchange="document.getElementById('u-ag-container').style.display = this.value === 'seller' ? 'block' : 'none'">
                                <option value="seller">Participante Vendedor</option>
                                <option value="admin">Administrador Master</option>
                                <option value="observer">Observador (Somente Leitura)</option>
                            </select>
                        </div>
                        <div class="input-group"><label>Foto de Perfil (Opcional)</label><input type="file" id="u-photo" accept="image/*"></div>
                    `, [
                        { text: '<i class="ti ti-check"></i> Cadastrar', class: 'btn', onClick: async () => {
                            const name = document.getElementById('u-name').value.trim(); const login = document.getElementById('u-mat').value.trim().toLowerCase();
                            const pwd = document.getElementById('u-pwd').value.trim(); const role = document.getElementById('u-role').value; const agId = document.getElementById('u-ag').value;

                            if(!name || !login || pwd.length < 6) return Utils.showToast('Verifique os campos. Senha mín 6 dgts.', 'error');
                            const email = login.includes('@') ? login : `${login}@conquista.app`;
                            const { error } = await supabaseClient.rpc('create_app_user', { p_email: email, p_password: pwd, p_name: name, p_login: login, p_role: role, p_agency_id: agId || null });
                            if(error) return Utils.showToast('Erro: ' + error.message, 'error');

                            const { data: newUser } = await supabaseClient.from('users').select('id').eq('login', login).single();
                            if(newUser) await handlePhotoUpload(newUser.id, 'u-photo');

                            await DB.logAction('USER_ADDED', `Usuário ${name} (Mat: ${login}) cadastrado.`, App.currentUser.id);
                            UI.closeModal(); UI.navigate('admin-settings'); Utils.showToast('Usuário Cadastrado!');
                        }},
                        { text: 'Cancelar', class: 'btn btn-outline', onClick: () => UI.closeModal() }
                    ]);
                };

                window.openEditUser = async (id) => {
                    if (!Utils.checkPermission()) return;
                    const u = await DB.getById('users', id);
                    const agencyOptions = activeAgencies.map(a => `<option value="${a.id}" ${u.agency_id === a.id ? 'selected' : ''}>${a.name} (${a.code})</option>`).join('');
                    UI.showModal('<i class="ti ti-pencil"></i> Editar Usuário', `
                        <div class="input-group"><label>Nome Completo</label><input type="text" id="e-u-name" value="${u.name}"></div>
                        <div class="input-group" id="e-u-ag-container" style="display: ${u.role === 'seller' ? 'block' : 'none'}"><label>Agência</label><select id="e-u-ag"><option value="">Selecione...</option>${agencyOptions}</select></div>
                        <div class="input-group"><label>Perfil de Acesso</label>
                            <select id="e-u-role" onchange="document.getElementById('e-u-ag-container').style.display = this.value === 'seller' ? 'block' : 'none'">
                                <option value="seller" ${u.role === 'seller' ? 'selected' : ''}>Participante Vendedor</option>
                                <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Administrador Master</option>
                                <option value="observer" ${u.role === 'observer' ? 'selected' : ''}>Observador (Somente Leitura)</option>
                            </select>
                        </div>
                        <div class="input-group"><label>Nova Foto (Deixe vazio para não alterar)</label><input type="file" id="e-u-photo" accept="image/*"></div>
                    `, [
                        { text: '<i class="ti ti-check"></i> Salvar', class: 'btn', onClick: async () => {
                            const name = document.getElementById('e-u-name').value.trim(); const role = document.getElementById('e-u-role').value; const agId = document.getElementById('e-u-ag').value;
                            if(!name) return Utils.showToast('Nome é obrigatório', 'error');
                            await DB.save('users', { ...u, name: name, role: role, agency_id: role === 'seller' ? agId : null });
                            await handlePhotoUpload(u.id, 'e-u-photo');
                            UI.closeModal(); UI.navigate('admin-settings'); Utils.showToast('Usuário Atualizado!');
                        }},
                        { text: 'Cancelar', class: 'btn btn-outline', onClick: () => UI.closeModal() }
                    ]);
                };

                window.toggleUserStatus = (id, newStatus, name) => {
                    if (!Utils.checkPermission()) return;
                    const acao = newStatus === 'active' ? 'Ativar' : 'Inativar';
                    UI.confirm(`${acao} Usuário`, `Deseja ${acao.toLowerCase()} o acesso de <b>${name}</b>?`, async () => {
                        await supabaseClient.from('users').update({ status: newStatus }).eq('id', id); UI.navigate('admin-settings'); Utils.showToast(`Usuário ${newStatus === 'active' ? 'Ativado' : 'Inativado'}!`);
                    });
                };

                window.openResetPassword = (id, name) => {
                    if (!Utils.checkPermission()) return;
                    UI.showModal('<i class="ti ti-key"></i> Redefinir Senha', `
                        <p class="text-center text-blue-dark" style="margin-bottom: 20px;">Defina uma nova senha provisória para <b>${name}</b>.<br><small>O usuário precisará criar uma nova senha no próximo login.</small></p>
                        <div class="input-group"><input type="password" id="reset-pwd-input" placeholder="Nova Senha (Mín 6 dígitos)"></div>
                    `, [
                        { text: '<i class="ti ti-check"></i> Salvar', class: 'btn', onClick: async () => {
                            const pwd = document.getElementById('reset-pwd-input').value.trim();
                            if(pwd.length < 6) return Utils.showToast('A senha deve ter no mínimo 6 dígitos', 'error');
                            const { error } = await supabaseClient.rpc('reset_user_password', { p_user_id: id, p_new_password: pwd });
                            if(error) return Utils.showToast('Erro: ' + error.message, 'error');
                            UI.closeModal(); Utils.showToast('Senha redefinida com sucesso!');
                        }},
                        { text: 'Cancelar', class: 'btn btn-outline', onClick: () => UI.closeModal() }
                    ]);
                };

                window.deleteGeneric = (table, id, name) => {
                    if (!Utils.checkPermission()) return;
                    UI.confirm('Excluir Registro', `Deseja excluir permanentemente <b>${name}</b>?`, async () => {
                        await DB.delete(table, id); UI.navigate('admin-settings'); Utils.showToast('Removido com Sucesso!');
                    });
                };

                window.saveCampaignDates = async () => {
                    if (!Utils.checkPermission()) return;
                    const btn = document.getElementById('btn-save-dates'); btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader ti-spin"></i>';
                    try {
                        const start = document.getElementById('camp-start').value; const end = document.getElementById('camp-end').value;
                        await DB.save('campaign_settings', { id: 1, start_date: start || null, end_date: end || null });
                        Utils.showToast('Datas salvas!'); await CampaignTimer.init();
                    } catch (e) { Utils.showToast('Erro ao salvar datas.', 'error'); }
                    btn.disabled = false; btn.innerHTML = '<i class="ti ti-device-floppy"></i> Salvar Datas';
                };

                const formatForInput = (d) => { if(!d) return ''; const date = new Date(d); date.setMinutes(date.getMinutes() - date.getTimezoneOffset()); return date.toISOString().slice(0,16); };
                const getRoleBadge = (role) => { if(role === 'admin') return '<span class="text-gold font-bold">Admin</span>'; if(role === 'observer') return '<span class="text-muted font-bold"><i class="ti ti-eye"></i> Obs.</span>'; return 'Vendedor'; };

                return `
                    <h2 class="section-title"><i class="ti ti-settings"></i> Configurações</h2>
                    <div class="config-grid animate-fade">

                        <div class="accordion">
                            <div class="accordion-header" onclick="UI.toggleAccordion(this)"><div class="flex items-center gap-2"><i class="ti ti-calendar"></i> Datas da Campanha</div><i class="ti ti-chevron-down"></i></div>
                            <div class="accordion-content">
                                <p class="text-blue-dark" style="margin-bottom: 15px;">Defina as datas para ativar a contagem regressiva e frases de incentivo nos Painéis Principais.</p>
                                <div class="input-group"><label>Data de Início</label><input type="datetime-local" id="camp-start" value="${formatForInput(campDates.start_date)}"></div>
                                <div class="input-group"><label>Data de Encerramento (Final)</label><input type="datetime-local" id="camp-end" value="${formatForInput(campDates.end_date)}"></div>
                                <button id="btn-save-dates" class="btn btn-sm" onclick="saveCampaignDates()"><i class="ti ti-device-floppy"></i> Salvar Datas</button>
                            </div>
                        </div>
                        
                        <div class="accordion">
                            <div class="accordion-header" onclick="UI.toggleAccordion(this)"><div class="flex items-center gap-2"><i class="ti ti-users"></i> Usuários do Sistema</div><i class="ti ti-chevron-down"></i></div>
                            <div class="accordion-content">
                                <div class="flex justify-end mb-3"><button class="btn btn-outline btn-sm" onclick="openAddUser()"><i class="ti ti-user-plus"></i> Novo Usuário</button></div>
                                <div class="table-responsive">
                                    <table class="responsive-table">
                                        <thead><tr><th>Membro</th><th>Matrícula</th><th>Perfil</th><th>Ações</th></tr></thead>
                                        <tbody>
                                            ${allUsers.map(u => `
                                                <tr class="${u.status === 'inactive' ? 'inactive-row' : ''}">
                                                    <td class="font-bold flex items-center gap-2">${Utils.renderAvatarHtml(u.name, u.avatar_url, 30, 1)} ${u.name}</td>
                                                    <td>${u.login}</td><td>${getRoleBadge(u.role)}</td>
                                                    <td class="actions-cell">
                                                        <button class="btn-icon edit" onclick="openEditUser('${u.id}')" title="Editar Usuário/Foto"><i class="ti ti-pencil"></i></button>
                                                        ${u.id !== App.currentUser.id ? `
                                                            <button class="btn-icon reset" onclick="openResetPassword('${u.id}', '${u.name}')" title="Redefinir Senha"><i class="ti ti-key"></i></button>
                                                            ${u.status === 'active' 
                                                                ? `<button class="btn-icon delete" onclick="toggleUserStatus('${u.id}', 'inactive', '${u.name}')" title="Inativar Usuário"><i class="ti ti-ban"></i></button>`
                                                                : `<button class="btn-icon activate" onclick="toggleUserStatus('${u.id}', 'active', '${u.name}')" title="Ativar Usuário"><i class="ti ti-check"></i></button>`
                                                            }
                                                        ` : ''}
                                                    </td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <div class="accordion">
                            <div class="accordion-header" onclick="UI.toggleAccordion(this)"><div class="flex items-center gap-2"><i class="ti ti-package"></i> Produtos e Regras</div><i class="ti ti-chevron-down"></i></div>
                            <div class="accordion-content">
                                <div class="flex justify-end mb-3"><button class="btn btn-outline btn-sm" onclick="openAddProduct()"><i class="ti ti-plus"></i> Novo Produto</button></div>
                                <div class="table-responsive">
                                    <table class="responsive-table">
                                        <thead><tr><th>Produto</th><th>Regra</th><th>Ações</th></tr></thead>
                                        <tbody>
                                            ${activeProds.map(p => `
                                                <tr>
                                                    <td class="font-bold">${p.name}</td>
                                                    <td>A cada ${Utils.formatCurrency(p.target_value)} = ${p.numbers_granted} nºs</td>
                                                    <td class="actions-cell">
                                                        <button class="btn-icon edit" onclick="openEditProduct('${p.id}')" title="Editar"><i class="ti ti-pencil"></i></button>
                                                        <button class="btn-icon delete" onclick="deleteGeneric('products', '${p.id}', '${p.name}')" title="Excluir"><i class="ti ti-trash"></i></button>
                                                    </td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <div class="accordion">
                            <div class="accordion-header" onclick="UI.toggleAccordion(this)"><div class="flex items-center gap-2"><i class="ti ti-building"></i> Gestão de Agências</div><i class="ti ti-chevron-down"></i></div>
                            <div class="accordion-content">
                                <div class="flex justify-end mb-3"><button class="btn btn-outline btn-sm" onclick="openAddAgency()"><i class="ti ti-plus"></i> Nova Agência</button></div>
                                <div class="table-responsive">
                                    <table class="responsive-table">
                                        <thead><tr><th>Código</th><th>Nome</th><th>Ações</th></tr></thead>
                                        <tbody>
                                            ${activeAgencies.map(a => `
                                                <tr>
                                                    <td class="font-bold text-blue-light">${a.code}</td><td>${a.name}</td>
                                                    <td class="actions-cell">
                                                        <button class="btn-icon edit" onclick="openEditAgency('${a.id}')" title="Editar"><i class="ti ti-pencil"></i></button>
                                                        <button class="btn-icon delete" onclick="deleteGeneric('agencies', '${a.id}', '${a.name}')" title="Excluir"><i class="ti ti-trash"></i></button>
                                                    </td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                    </div>
                `;
            }
        };

        window.onload = () => App.init();
    </script>
</body>
</html>
